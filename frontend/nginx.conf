server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Quan trọng cho SPA: mọi route không tìm thấy file đều trả về index.html
    # để React Router tự xử lý (tránh lỗi 404 khi F5 ở /pos, /reports...)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
