name: CI/CD - Tiem Net Management System

# Kích hoạt pipeline khi push hoặc tạo Pull Request vào nhánh main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ---------------- JOB 1: Kiểm thử Backend ----------------
  backend-test:
    name: Backend - Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài đặt thư viện
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chạy Unit Test & Integration Test kèm đo Test Coverage (pytest-cov)
        working-directory: ./backend
        env:
          TESTING: "1"
        run: |
          python -m pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Lưu báo cáo Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  # ---------------- JOB 2: Build Frontend ----------------
  frontend-build:
    name: Frontend - Build React
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cài đặt thư viện npm
        working-directory: ./frontend
        run: npm install

      - name: Chạy Unit Test Frontend (Vitest)
        working-directory: ./frontend
        run: npm test

      - name: Build production bundle
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Lưu artifact bản build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # ---------------- JOB 4: End-to-End Test (Playwright) ----------------
  e2e-test:
    name: E2E Test (Playwright)
    runs-on: ubuntu-latest
    needs: [docker-build]

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Khởi động toàn bộ hệ thống bằng Docker Compose
        run: docker compose up --build -d

      - name: Chờ Backend & Frontend sẵn sàng
        run: |
          npx wait-on http://localhost:8000/docs http://localhost:5173 --timeout 120000

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cài đặt Playwright
        working-directory: ./e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Chạy E2E Test
        working-directory: ./e2e
        run: npm test

      - name: Lưu báo cáo E2E (kể cả khi fail, để xem log lỗi)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/

      - name: Dừng hệ thống
        if: always()
        run: docker compose down -v
  # ---------------- JOB 3: Build Docker Image (chỉ chạy khi 2 job trên pass) ----------------
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t tiemnet-backend:latest ./backend

      - name: Build Frontend Image
        run: docker build -t tiemnet-frontend:latest ./frontend
